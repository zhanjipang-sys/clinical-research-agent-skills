  rationale: 'The SSc v1 model built in Gemini web Chat one-shot failed two independent audits (assistant-msg-8d816e45 found 9 confirmed, 7 wrong and 24 unsourced of 40 source items, including a misread focuSSced result and negative trials written as effective; assistant-msg-04f34d99 gave a concordant GLM FAIL). The same class of work succeeded when routed to Gemini web Work or Task mode in segments with main-session per-item verification: HS v10 manuscript parts 1 to 3 passed (assistant-msg-feeb7d07, assistant-msg-cc79dc69, assistant-msg-0ff562a1), the trauma book reached 91 of 91 chapters that way and its stage 3 supplement batch 1 passed 37 of 37 PMID checks (assistant-msg-851c225e), and the routing rule was refined after a misclassification admission (assistant-msg-f98930ed). Skill search returned no skill covering channel routing plus segmented dispatch: manuscript_number_reconciliation only reconciles numbers in a finished draft and ai_revision_anchor_check only guards revision drift. This skill codifies the routing decision, the per-segment brief contract, and the verify-before-next-segment gate.'
