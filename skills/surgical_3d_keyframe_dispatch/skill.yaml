  rationale: The generic operation mechanics review in the 2026-11-04 publication did not catch a flap type specific error. On 2026-11-17 the user vetoed a set of flat schematics presented as true 3D because the advancement flap design was wrong on its cut edges and dog-ear placement and the deliverable was mislabelled, and the whole set was downgraded to unapproved schematic drafts. The skill already covers reference first design, clinical photo base, keyframe gate and executor disclosure, but it has no per-flap checklist naming cut edges, pedicle cut state and dog-ear location, and no rule reserving true 3D for anatomical surfaces with a perspective camera. This update adds both, with the advancement three sides cut with distal pedicle uncut and dog-ear at the original farthest end corners, the bilobed tissue bridge uncut, and the leave long then trim tip rule. ADV-1 and V-Y gates passed after the veto, showing the gate works while these two gaps remain open.
