  rationale: 'The skill published on 2026-11-18 instructs comparing each file record count with the registry read count. On 2026-11-19 that comparison failed all 263 runs of HS v10 segment 7 (PRJEB43835) as DLFAIL. Root cause was a registry convention, not bad downloads: for ENA paired end ERR runs the registry read count is the total across both files (111754 for ERR5554167) while each single file holds half (55877), and SRR registry counts are read pairs, so the first six segments were unaffected (handoff 5229d1e3). The user ordered retries stopped, the validation fixed, and only segment 7 rerun (b32e733a). The documented fix in VALIDATION_FIX_20261119.md (8b0d965e) accepts count equal to the registered count or exactly half of it, and the restarted segment validated its first runs at 55877 records. The current SKILL.md text, read this run, contains no such convention, so the published instruction still causes the failure. This update adds the convention, the scope limit, and a stop and fix rule for uniform segment wide count failures.'
