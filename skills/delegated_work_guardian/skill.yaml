  rationale: 'The 2026-11-17 wedding-stage2b2 resume wake (cron run 401c4006-453f-4c3d-aea0-3d67fe56df9c) FAILED with ''The worker reported that the work is not finished''. The in-session diagnosis (assistant-msg-cdac7c68) was that the cron run ended and cleaned up the long dispatch it had spawned: the dispatch verified alive at 05:16 with no credits spent, and a re-dispatch from the main chat at 05:25:59 worked, as had two earlier main-chat dispatches running 66 and 35 minutes. The managed delegated_work_guardian skill (rev 0ac6109f) tells the agent to launch through the tracked muse.exec route and to use cron.add as a monitor or expiry check, but it never states that a cron worker is not itself a launch route, so the wake pattern looked permitted. The fix adds that rule to the existing Launch section: launch only from the main chat, a wake only checks state and reports, and a cron failure of this shape means re-dispatch from the main chat. Checked and deliberately not proposed: the SINTAX stochastic disagreement (Codex 44/1166 ASV differ vs GLM 0) is still under an in-session arbitration protocol (A/B/C runs, three executors, monitor succeeded) with no concluded outcome, so codifying it now would be premature; manuscript_number_reconciliation covers deterministic number-vs-table reconciliation, not stochastic classifier runs. The X image-plus-poll split rule is already codified in MEMORY.md and the system social_publishing skill covers posting, so no new X skill. The Flow first-frame root cause and the clinical-photo-base rule are already in AGENTS.md and in the managed surgical_3d_keyframe_dispatch file (verified by reading it). local_anatomy was read in full and is a complete substantive skill, not a recoverable note. The deterministic rollup candidates (repeated handoff suppressions, recurring memory/relationships/goals/ideas failures) read as objective-loop prompt and cadence matters, not managed-skill failures, with no failure detail in the packet to ground a change.'
